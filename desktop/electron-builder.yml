appId: com.seniormentor.app
productName: Senior Interview Mentor
copyright: Copyright © 2026

# Don't use asar — tsx needs .ts file access at runtime
asar: false

directories:
  output: ../release

# Files to bundle into the app
files:
  - dist-electron/**/*
  - icons/**/*

# Extra resources bundled alongside the app
extraResources:
  # Built frontend
  - from: ../web/dist
    to: web/dist
    filter:
      - "**/*"
  # Server source (tsx runs .ts files directly)
  - from: ../web/server
    to: web/server
    filter:
      - "**/*"
  # Server needs web/package.json for module resolution
  - from: ../web/package.json
    to: web/package.json
  # Server node_modules
  - from: ../web/node_modules
    to: web/node_modules
    filter:
      - "**/*"
  # Icons for tray
  - from: icons
    to: icons
    filter:
      - "**/*"

win:
  target:
    - nsis
    - portable
  icon: icons/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: icons/icon.ico
  uninstallerIcon: icons/icon.ico

portable:
  artifactName: "${productName}-${version}-portable.${ext}"

mac:
  target:
    - dmg
    - zip
  icon: icons/icon.icns
  category: public.app-category.developer-tools

linux:
  target:
    - AppImage
    - deb
  icon: icons/icon.png
  category: Development

publish:
  provider: github
